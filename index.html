<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurenjay | Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937, #374151);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 700px;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #d1d5db;
    }

    h1 {
      font-size: clamp(42px, 8vw, 82px);
      margin-bottom: 20px;
      line-height: 1.05;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #d1d5db;
      margin-bottom: 32px;
    }

    .domain {
      font-weight: bold;
      color: #ffffff;
    }

    .footer {
      margin-top: 48px;
      font-size: 14px;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="badge">Coming Soon</div>

    <h1>Aurenjay is launching soon.</h1>

    <p>
      We are working on something special. Our website will be available here shortly.
    </p>

    <p class="domain">
      www.aurenjay.com
    </p>

    <div class="footer">
      © 2026 Aurenjay. All rights reserved.
    </div>
  </main>
</body>
</html>
